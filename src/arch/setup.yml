bayesian_gnn:
  input_dim: 512
  hidden_dim: 1024
  output_dim: 2
  n_hidden: 1
  epochs: 500
  lr: 1e-5
  weight_decay: 0.01
  dropout: 0.5
  batch_size: 32
  num_workers: 4
  n_neigh_train: 16
  n_neigh_full: 16
  graph_mode: knn
  lbl_train_frac: 0.8
  sample: false
  loss: "nll_balanced"
  best_model_metric: "best_hm"
  dataset: "CrisisMMD"
  imageft: "maxvit"
  textft: "mpnet"
  fusion: "early"
  reduction: autoenc
  autoenc: base_ae
  group: gnn
  num_test_inference_run: 10
  num_inference_run: 100
  hetero: false
  single_modal_loss: false

bayesian_gnn_clip:
  base: bayesian_gnn
  input_dim: 1024
  hidden_dim: 2048
  imageft: "clip"
  textft: "clip"
  reduction: null

bayesian_mlp:
  base: bayesian_gnn
  group: mlp

bayesian_hybrid:
  base: bayesian_gnn
  group: hybrid

bayesian_gnn_sim:
  base: bayesian_gnn
  graph_mode: sim

bayesian_gnn_sim_conn:
  base: bayesian_gnn
  graph_mode: sim-connected

bayesian_mlp_clip:
  base: bayesian_gnn_clip
  group: mlp

bayesian_hybrid_clip:
  base: bayesian_gnn_clip
  group: hybrid

bayesian_mlp_clip_double:
  base: bayesian_mlp_clip
  hidden_dim: 4096
  output_dim: 2

bayesian_mlp_clip_4x:
  base: bayesian_mlp_clip
  hidden_dim: 8192
  output_dim: 2

base_ae:
  input_dim: 512
  hidden_dim: [256]
  norm: true
  dropout: 0.5
  epochs: 2000

bayesian_hetero_gnn:
  base: bayesian_gnn_clip
  hetero: true

bayesian_hetero_gnn_sml_late:
  base: bayesian_hetero_gnn
  single_modal_loss: late

bayesian_hetero_gnn_sml_middle:
  base: bayesian_hetero_gnn
  single_modal_loss: middle

bayesian_gnn_clip_20:
  base: bayesian_gnn_clip
  num_test_inference_run: 20

bayesian_gnn_clip_15:
  base: bayesian_gnn_clip
  num_test_inference_run: 15

base_gnn:
  base: bayesian_gnn_clip
  group: gnn-base

base_mlp:
  base: bayesian_gnn_clip
  group: mlp-base